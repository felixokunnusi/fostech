{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="mb-4">

        <h2>
            {% if edit_mode %}
                Edit Subject Category
            {% else %}
                New Subject Category
            {% endif %}
        </h2>

        <p class="text-muted mb-0">
            {{ school.name }}
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label"
                    >
                        Category Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        value="{{ category.name if category else '' }}"
                        required
                        maxlength="100"
                    >

                    <div class="form-text">
                        Example: Science, Business, Humanities, Trade.
                    </div>

                </div>

                <div class="mb-3">

                    <label
                        for="description"
                        class="form-label"
                    >
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                    >{{ category.description if category and category.description else '' }}</textarea>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        {% if edit_mode %}
                            Save Changes
                        {% else %}
                            Create Category
                        {% endif %}
                    </button>

                    <a
                        href="{{ url_for(
                            'staff.subject_categories',
                            school_id=school.id
                        ) }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
